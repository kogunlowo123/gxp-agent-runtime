name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint and format
        run: |
          uv run ruff check src tests
          uv run black --check src tests
      - name: Type check
        run: uv run mypy
      - name: Static security analysis
        run: uv run python -m bandit -q -r src -c pyproject.toml
      - name: Published contracts are current
        run: uv run python -m gxp_agent_runtime.contracts --check
      - name: Unit, security, chaos, performance and e2e tests (coverage gate 90%)
        run: uv run pytest --cov-report=xml --junitxml=junit.xml
      - name: Validation evidence (URS traceability, every requirement verified)
        run: >-
          uv run python -m gxp_agent_runtime.validation --junit junit.xml
          --out validation-package.json --markdown traceability-matrix.md --strict
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: evidence
          path: |
            coverage.xml
            junit.xml
            validation-package.json
            traceability-matrix.md

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: gxp
          POSTGRES_USER: gxp
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gxp" --health-interval 5s --health-retries 10
    env:
      GXP_TEST_DATABASE_URL: postgresql+asyncpg://gxp:ci-only@localhost:5432/gxp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - run: uv run pytest tests/integration -m integration --no-cov -ra

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2
      - name: Helm lint and render
        run: |
          helm lint deployments/helm/gxp-agent-runtime \
            -f deployments/helm/gxp-agent-runtime/ci/test-values.yaml
          helm template gxp deployments/helm/gxp-agent-runtime \
            -f deployments/helm/gxp-agent-runtime/ci/test-values.yaml > rendered.yaml
          if helm template gxp deployments/helm/gxp-agent-runtime > /dev/null 2>&1; then
            echo "chart rendered without required values"; exit 1
          fi
      - name: Kubernetes schema validation (kubeconform)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml deployments/kubernetes/namespace.yaml deployments/kubernetes/external-secrets.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform fmt and validate (aws, azure, gcp)
        run: |
          terraform fmt -recursive -check deployments/terraform
          for cloud in aws azure gcp; do
            terraform -chdir=deployments/terraform/$cloud init -backend=false -input=false
            terraform -chdir=deployments/terraform/$cloud validate
          done
      - name: IaC and Kubernetes misconfiguration scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: deployments
          severity: HIGH,CRITICAL
          exit-code: "1"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gxp-agent-runtime:ci .
      - name: Container smoke test (starts, reports healthy)
        run: |
          docker run -d --name gxp -p 8080:8080             -e GXP_ENVIRONMENT=ci -e GXP_DEV_EPHEMERAL_KEYS=true             -e GXP_PUBLIC_URL=http://localhost:8080             -e GXP_DATABASE_URL=sqlite+aiosqlite:////tmp/gxp.db             -e GXP_SIGNER_ISSUER=https://login.ci.internal -e GXP_SIGNER_AUDIENCE=gxp-agent-runtime             -e GXP_SIGNER_JWKS_URL=https://login.ci.internal/jwks             -e GXP_AGENT_ISSUER=https://identity.ci.internal             -e GXP_AGENT_JWKS_URL=https://identity.ci.internal/.well-known/jwks.json             gxp-agent-runtime:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/readyz && break; sleep 1
          done
          curl -sf http://localhost:8080/readyz
          curl -sf http://localhost:8080/.well-known/jwks.json | grep -q EdDSA
          curl -sf http://localhost:8080/.well-known/agent-card.json | grep -q '"GxP Agent Runtime"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/actions)" = 401
          docker inspect --format '{{.Config.User}}' gxp-agent-runtime:ci | grep -q 10001
          docker logs gxp
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gxp-agent-runtime:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Image SBOM (Syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: gxp-agent-runtime:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: SBOM vulnerability gate (Grype)
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/secrets --config p/dockerfile --error --metrics=off src Dockerfile
