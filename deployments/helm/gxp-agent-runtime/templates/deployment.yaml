{{- /*
Deployment: replicas are stateless. Each process writes its own audit hash
chain (chain id = pod name + random suffix) into PostgreSQL, so no
per-replica volume is needed.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gxp.fullname" . }}
  labels: {{- include "gxp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "gxp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gxp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels: {{- include "gxp.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        - name: runtime
          image: {{ include "gxp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "gxp.fullname" . }}
          env:
            - name: GXP_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GXP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: DATABASE_URL
            - name: GXP_FORWARDED_ALLOW_IPS
              value: "*"
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: signing-key
              mountPath: /etc/gxp-agent-runtime/signing-key
              readOnly: true
            - name: audit-key
              mountPath: /etc/gxp-agent-runtime/audit-key
              readOnly: true
            {{- if .Values.secrets.trustedPublicKeys }}
            - name: trusted-keys
              mountPath: /etc/gxp-agent-runtime/trusted-keys
              readOnly: true
            {{- end }}
            {{- if .Values.gxp.runtimeClientId }}
            - name: identity-fabric-token
              mountPath: /var/run/secrets/tokens/identity-fabric
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: signing-key
          secret:
            secretName: {{ .Values.secrets.signingKey }}
            defaultMode: 0400
        - name: audit-key
          secret:
            secretName: {{ .Values.secrets.auditKey }}
            defaultMode: 0400
        {{- with .Values.secrets.trustedPublicKeys }}
        - name: trusted-keys
          secret:
            secretName: {{ . }}
            defaultMode: 0444
        {{- end }}
        {{- if .Values.gxp.runtimeClientId }}
        - name: identity-fabric-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.gxp.workloadTokenAudience | quote }}
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
