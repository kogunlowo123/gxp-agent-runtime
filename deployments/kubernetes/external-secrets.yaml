# Syncs runtime secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates (database URL) and the names
# the key ceremony in docs/runbooks/startup.md uses (signing and audit keys).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gxp-agent-runtime-database
  namespace: gxp-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: gxp-agent-runtime-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: gxp-agent-runtime-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gxp-agent-runtime-signing-key
  namespace: gxp-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: gxp-agent-runtime-signing-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^gxp-agent-runtime-records-key-"
      rewrite:
        - regexp:
            source: "^gxp-agent-runtime-records-key-(.*)$"
            target: "records-$1.pem"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gxp-agent-runtime-audit-key
  namespace: gxp-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: gxp-agent-runtime-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^gxp-agent-runtime-audit-key-"
      rewrite:
        - regexp:
            source: "^gxp-agent-runtime-audit-key-(.*)$"
            target: "audit-$1.pem"
