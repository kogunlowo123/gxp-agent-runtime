# Local development stack: GxP runtime + PostgreSQL + agent-identity-fabric
# (agent credentials, introspection, authorization) + an OIDC provider that
# plays the enterprise IdP for people and the workload issuer for agents,
# + an OpenTelemetry collector. Uses in-memory signing keys
# (GXP_DEV_EPHEMERAL_KEYS); never use this configuration outside a
# developer workstation.
name: gxp-agent-runtime

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: gxp
      POSTGRES_PASSWORD: gxp-local-only
      POSTGRES_DB: gxp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gxp -d gxp"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8080"
    ports:
      - "8081:8080"

  fabric:
    image: ghcr.io/kogunlowo123/agent-identity-fabric:v0.1.0
    depends_on:
      oidc:
        condition: service_started
    ports:
      - "8082:8080"
    environment:
      FABRIC_ENVIRONMENT: development
      FABRIC_DEV_EPHEMERAL_KEYS: "true"
      FABRIC_TRUST_DOMAIN: agents.local
      FABRIC_ISSUER: http://fabric:8080
      FABRIC_DATABASE_URL: sqlite+aiosqlite:////tmp/fabric.db
      FABRIC_AUDIT_LOG_PATH: /tmp/fabric-audit.jsonl
      FABRIC_WORKLOAD_ISSUERS: '{"http://oidc:8080/workload": "http://oidc:8080/workload/jwks"}'
      FABRIC_ADMIN_ISSUER: http://oidc:8080/admin
      FABRIC_ADMIN_AUDIENCE: identity-fabric-admin
      FABRIC_ADMIN_JWKS_URL: http://oidc:8080/admin/jwks

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  runtime:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      fabric:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      GXP_ENVIRONMENT: development
      GXP_DEV_EPHEMERAL_KEYS: "true"
      GXP_PUBLIC_URL: http://localhost:8080
      GXP_DATABASE_URL: postgresql+asyncpg://gxp:gxp-local-only@postgres:5432/gxp
      GXP_SIGNER_ISSUER: http://oidc:8080/enterprise
      GXP_SIGNER_AUDIENCE: gxp-agent-runtime
      GXP_SIGNER_JWKS_URL: http://oidc:8080/enterprise/jwks
      GXP_FABRIC_URL: http://fabric:8080
      GXP_OTLP_ENDPOINT: http://otel-collector:4317
      GXP_LOG_LEVEL: DEBUG

volumes:
  pgdata:
